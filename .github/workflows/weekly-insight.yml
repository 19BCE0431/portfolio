name: Weekly Insight Draft

on:
  schedule:
    # Sunday 09:00 IST = Sunday 03:30 UTC.
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-weekly-insight:
    name: Generate weekly insight PR
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1' }}
      WEEKLY_INSIGHT_USE_OPENAI: "true"
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
      WEEKLY_INSIGHT_PORTFOLIO_BASE_URL: ${{ secrets.WEEKLY_INSIGHT_PORTFOLIO_BASE_URL || 'https://mohitsaikrishna.in' }}
      WEEKLY_INSIGHT_STATUS: ${{ secrets.WEEKLY_INSIGHT_STATUS || 'review' }}
      WEEKLY_INSIGHT_AUTO_PUBLISH: ${{ secrets.WEEKLY_INSIGHT_AUTO_PUBLISH || 'false' }}
      LINKEDIN_AUTO_POST: ${{ secrets.LINKEDIN_AUTO_POST || 'false' }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER || '917680030135' }}
      WHATSAPP_NOTIFY: ${{ secrets.WHATSAPP_NOTIFY || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set weekly date and branch
        run: |
          DATE="$(TZ=Asia/Kolkata date +%F)"
          echo "WEEKLY_DATE=$DATE" >> "$GITHUB_ENV"
          echo "WEEKLY_BRANCH=weekly-insight/$DATE" >> "$GITHUB_ENV"

      - name: Check auto-publish branch safety
        run: |
          if [ "$WEEKLY_INSIGHT_AUTO_PUBLISH" = "true" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Auto-publish can only run from the main branch."
            exit 1
          fi

      - name: Check required OpenAI secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing. Add it in GitHub repository Settings > Secrets and variables > Actions before running the weekly insight workflow."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly insight draft
        run: |
          ARGS=(--date "$WEEKLY_DATE" --use-ai --manifest weekly-insight-manifest.json)

          if [ "$WEEKLY_INSIGHT_AUTO_PUBLISH" = "true" ]; then
            ARGS+=(--publish)
          else
            ARGS+=(--status "${WEEKLY_INSIGHT_STATUS:-review}")
          fi

          npm run generate:weekly-insight -- "${ARGS[@]}"

      - name: Export weekly manifest values
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("weekly-insight-manifest.json", "utf8"));
          const base = (process.env.WEEKLY_INSIGHT_PORTFOLIO_BASE_URL || "").replace(/\/$/, "");
          console.log(`WEEKLY_SLUG=${manifest.slug || ""}`);
          console.log(`WEEKLY_BLOG_URL=${base && manifest.slug ? `${base}/journal/${manifest.slug}` : ""}`);
          console.log(`WEEKLY_LINKEDIN_DRAFT=${manifest.linkedinDraftPath || ""}`);
          NODE

      - name: Run lint
        run: npm run --if-present lint

      - name: Run build
        run: npm run build

      - name: Validate auto-publish safety
        if: env.WEEKLY_INSIGHT_AUTO_PUBLISH == 'true'
        run: npm run validate:weekly-publish -- --manifest weekly-insight-manifest.json

      - name: Prepare pull request body
        if: env.WEEKLY_INSIGHT_AUTO_PUBLISH != 'true'
        run: |
          node <<'NODE' > weekly-insight-pr-body.md
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("weekly-insight-manifest.json", "utf8"));

          const lines = [
            `## Weekly insight draft: ${manifest.date}`,
            "",
            `**Generated blog title:** ${manifest.title || "Review generated draft"}`,
            "",
            `**Short summary:** ${manifest.summary || "Review the generated draft for quality and accuracy."}`,
            "",
            "### Generated files",
            "",
            `- Portfolio article: \`${manifest.articlePath || "Not found"}\``,
            `- LinkedIn draft: \`${manifest.linkedinDraftPath || "Not found"}\``,
            `- Research note: \`${manifest.researchNotePath || "Not found"}\``,
            `- Visual prompt: \`${manifest.visualPromptPath || "Not found"}\``,
            "",
            "### Review checklist",
            "",
            "- [ ] Confirm the topic is worth publishing this week.",
            "- [ ] Verify all source-backed claims and source links.",
            "- [ ] Rewrite any generic or robotic phrasing.",
            "- [ ] Confirm the blog status should remain `review` until manually approved.",
            "- [ ] Confirm the LinkedIn draft is not posted automatically.",
            "- [ ] Confirm visual prompts are copyright-safe before creating assets.",
            "- [ ] Merge only when the portfolio update is ready to publish.",
            "",
            "This workflow does not auto-merge, auto-publish, or post to LinkedIn in review-first mode. WhatsApp notifications run only when explicitly enabled.",
          ];

          fs.writeFileSync("weekly-insight-title.txt", manifest.title || "");
          process.stdout.write(`${lines.join("\n")}\n`);
          NODE

      - name: Create weekly branch and commit
        if: env.WEEKLY_INSIGHT_AUTO_PUBLISH != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$WEEKLY_BRANCH"
          git add content/research-notes content/journal content/linkedin-drafts content/generated-assets

          if git diff --cached --quiet; then
            echo "No generated content changes found. Skipping PR creation."
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "Add weekly insight draft for $WEEKLY_DATE"
          git push --force-with-lease origin "$WEEKLY_BRANCH"

      - name: Open or update pull request
        if: env.WEEKLY_INSIGHT_AUTO_PUBLISH != 'true' && env.NO_CHANGES != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Weekly insight draft: $WEEKLY_DATE"

          if gh pr view "$WEEKLY_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$WEEKLY_BRANCH" \
              --title "$TITLE" \
              --body-file weekly-insight-pr-body.md
            PR_LINK="$(gh pr view "$WEEKLY_BRANCH" --json url --jq .url)"
          else
            PR_LINK="$(gh pr create \
              --base main \
              --head "$WEEKLY_BRANCH" \
              --title "$TITLE" \
              --body-file weekly-insight-pr-body.md)"
          fi

          echo "PR_LINK=$PR_LINK" >> "$GITHUB_ENV"

      - name: Send WhatsApp draft notification
        if: env.WEEKLY_INSIGHT_AUTO_PUBLISH != 'true' && env.NO_CHANGES != 'true' && env.WHATSAPP_NOTIFY == 'true'
        continue-on-error: true
        run: node scripts/send-whatsapp-notification.js --type draft-ready --pr-link "$PR_LINK"

      - name: Commit published weekly insight to main
        if: env.WEEKLY_INSIGHT_AUTO_PUBLISH == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research-notes content/journal content/linkedin-drafts content/generated-assets

          if git diff --cached --quiet; then
            echo "No generated content changes found. Skipping auto-publish commit."
            echo "AUTO_PUBLISH_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "Publish weekly insight for $WEEKLY_DATE"
          git push origin HEAD:main
          echo "AUTO_PUBLISH_CHANGED=true" >> "$GITHUB_ENV"

      - name: Send WhatsApp portfolio published notification
        if: env.WEEKLY_INSIGHT_AUTO_PUBLISH == 'true' && env.AUTO_PUBLISH_CHANGED == 'true' && env.WHATSAPP_NOTIFY == 'true'
        continue-on-error: true
        run: node scripts/send-whatsapp-notification.js --message "Weekly insight published to portfolio: $WEEKLY_BLOG_URL"

      - name: Auto-post approved LinkedIn draft
        if: env.WEEKLY_INSIGHT_AUTO_PUBLISH == 'true' && env.AUTO_PUBLISH_CHANGED == 'true' && env.LINKEDIN_AUTO_POST == 'true'
        run: |
          if [ -z "$LINKEDIN_ACCESS_TOKEN" ] || [ -z "$LINKEDIN_AUTHOR_URN" ]; then
            echo "LinkedIn auto-post skipped: missing configuration"
            exit 0
          fi

          node scripts/post-to-linkedin.js --draft "$WEEKLY_SLUG" --result linkedin-post-result.json
          echo "LINKEDIN_POSTED=true" >> "$GITHUB_ENV"

      - name: Commit LinkedIn posted metadata
        if: env.LINKEDIN_POSTED == 'true'
        run: |
          if git diff --quiet content/linkedin-drafts; then
            echo "No LinkedIn draft metadata changes to commit."
            exit 0
          fi

          git add content/linkedin-drafts
          git commit -m "Mark weekly LinkedIn draft as posted"
          git push origin HEAD:main

      - name: Send WhatsApp LinkedIn posted notification
        if: env.LINKEDIN_POSTED == 'true' && env.WHATSAPP_NOTIFY == 'true'
        continue-on-error: true
        run: |
          BLOG_URL="$(node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('linkedin-post-result.json','utf8'));process.stdout.write(r.blogUrl || process.env.WEEKLY_BLOG_URL || '')")"
          LINKEDIN_URL="$(node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('linkedin-post-result.json','utf8'));process.stdout.write(r.linkedInUrl || '')")"
          node scripts/send-whatsapp-notification.js \
            --type linkedin-posted \
            --blog-url "$BLOG_URL" \
            --linkedin-url "$LINKEDIN_URL"

      - name: Send WhatsApp failure notification
        if: failure() && env.WHATSAPP_NOTIFY == 'true'
        continue-on-error: true
        run: node scripts/send-whatsapp-notification.js --type workflow-failed --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
