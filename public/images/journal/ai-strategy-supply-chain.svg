<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI strategy supply chain</title>
  <desc id="desc">An abstract editorial system map showing compute, context, latency, cost, decisions, and feedback as a supply chain of intelligence.</desc>
  <rect width="1600" height="900" fill="#F7F3EA"/>
