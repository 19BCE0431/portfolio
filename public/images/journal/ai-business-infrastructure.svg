<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI business infrastructure map</title>
  <desc id="desc">An abstract editorial map showing compute, data, agents, workflows, and decisions connected as business infrastructure.</desc>
  <rect width="1600" height="900" fill="#F6F3EA"/>
