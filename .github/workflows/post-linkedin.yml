name: Post Approved LinkedIn Draft

on:
  workflow_dispatch:
    inputs:
      draft_slug:
        description: "LinkedIn draft slug or related blog slug to post"
        required: true
        type: string

permissions:
  contents: write

jobs:
  post-linkedin:
    name: Post approved LinkedIn draft
    runs-on: ubuntu-latest
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      WEEKLY_INSIGHT_PORTFOLIO_BASE_URL: ${{ secrets.WEEKLY_INSIGHT_PORTFOLIO_BASE_URL || 'https://mohitsaikrishna.in' }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER || '917680030135' }}
      WHATSAPP_NOTIFY: ${{ secrets.WHATSAPP_NOTIFY || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Post approved LinkedIn draft
        run: node scripts/post-to-linkedin.js --draft "${{ inputs.draft_slug }}" --result linkedin-post-result.json

      - name: Send WhatsApp published notification
        if: env.WHATSAPP_NOTIFY == 'true'
        continue-on-error: true
        run: |
          BLOG_URL="$(node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('linkedin-post-result.json','utf8'));process.stdout.write(r.blogUrl || '')")"
          LINKEDIN_URL="$(node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('linkedin-post-result.json','utf8'));process.stdout.write(r.linkedInUrl || '')")"
          node scripts/send-whatsapp-notification.js \
            --type linkedin-posted \
            --blog-url "$BLOG_URL" \
            --linkedin-url "$LINKEDIN_URL"

      - name: Commit posted metadata
        run: |
          if git diff --quiet content/linkedin-drafts; then
            echo "No LinkedIn draft metadata changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/linkedin-drafts
          git commit -m "Mark LinkedIn draft as posted"
          git push

      - name: Send WhatsApp failure notification
        if: failure() && env.WHATSAPP_NOTIFY == 'true'
        continue-on-error: true
        run: node scripts/send-whatsapp-notification.js --type workflow-failed --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
