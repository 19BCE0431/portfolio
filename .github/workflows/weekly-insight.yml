name: Weekly Insight Draft

on:
  schedule:
    # Sunday 09:00 India time.
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      status:
        description: "Draft status to use"
        required: false
        default: "review"
        type: choice
        options:
          - review
          - draft

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1' }}
      WEEKLY_INSIGHT_USE_OPENAI: "true"
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
      WEEKLY_INSIGHT_PORTFOLIO_BASE_URL: ${{ secrets.WEEKLY_INSIGHT_PORTFOLIO_BASE_URL || 'https://mohitsaikrishna.in' }}
      WEEKLY_INSIGHT_STATUS: ${{ github.event.inputs.status || secrets.WEEKLY_INSIGHT_STATUS || 'review' }}
      WHATSAPP_NOTIFY: ${{ secrets.WHATSAPP_NOTIFY || 'false' }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER || '917680030135' }}
    steps:
      - name: Check OpenAI configuration
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY must be added to GitHub repository secrets before weekly drafts can run."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Generate weekly insight draft
        run: npm run generate:weekly-insight -- --manifest weekly-insight-manifest.json --status "$WEEKLY_INSIGHT_STATUS"

      - run: npm run build

      - run: npm run lint --if-present

      - name: Prepare pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(date -u +%F)"
          BRANCH="weekly-insight/$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add content
          if git diff --cached --quiet; then
            echo "No generated content changes to commit."
            exit 0
          fi
          git commit -m "Generate weekly insight draft: $DATE"
          git push --force-with-lease origin "$BRANCH"
          node <<'NODE' > weekly-pr-body.md
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("weekly-insight-manifest.json", "utf8"));
          console.log(`Generated blog title: ${manifest.title || "Review generated draft"}`);
          console.log("");
          console.log(`Article: ${manifest.articlePath || "n/a"}`);
          console.log(`LinkedIn draft: ${manifest.linkedinDraftPath || "n/a"}`);
          console.log(`Research note: ${manifest.researchNotePath || "n/a"}`);
          console.log(`Visual prompts: ${manifest.visualPromptPath || "n/a"}`);
          console.log("");
          console.log("Review checklist:");
          console.log("- Verify every source-backed claim.");
          console.log("- Remove TODOs or keep status as review.");
          console.log("- Confirm the hook, LinkedIn question, and visual prompt are human-approved.");
          console.log("- Do not publish or post to LinkedIn until manually approved.");
          NODE
          gh pr view "$BRANCH" --json number >/dev/null 2>&1 \
            && gh pr edit "$BRANCH" --title "Weekly insight draft: $DATE" --body-file weekly-pr-body.md \
            || gh pr create --base main --head "$BRANCH" --title "Weekly insight draft: $DATE" --body-file weekly-pr-body.md

      - name: Optional WhatsApp notification
        if: ${{ success() && env.WHATSAPP_NOTIFY == 'true' }}
        continue-on-error: true
        run: |
          PR_LINK="$(gh pr view "weekly-insight/$(date -u +%F)" --json url --jq .url 2>/dev/null || true)"
          node scripts/send-whatsapp-notification.js --type draft-ready --pr-link "$PR_LINK"
        env:
          GH_TOKEN: ${{ github.token }}
