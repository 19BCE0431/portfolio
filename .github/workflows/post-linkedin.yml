name: Post Approved LinkedIn Draft

on:
  workflow_dispatch:
    inputs:
      draft_slug:
        description: "LinkedIn draft slug or related blog slug"
        required: true
        type: string

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      WEEKLY_INSIGHT_PORTFOLIO_BASE_URL: ${{ secrets.WEEKLY_INSIGHT_PORTFOLIO_BASE_URL || 'https://mohitsaikrishna.in' }}
      WHATSAPP_NOTIFY: ${{ secrets.WHATSAPP_NOTIFY || 'false' }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER || '917680030135' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Post approved draft to LinkedIn
        run: node scripts/post-to-linkedin.js --draft "${{ inputs.draft_slug }}" --result linkedin-post-result.json

      - name: Commit posted metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/linkedin-drafts
          if git diff --cached --quiet; then
            echo "No LinkedIn metadata changes to commit."
            exit 0
          fi
          git commit -m "Mark LinkedIn draft as posted"
          git push

      - name: Optional WhatsApp notification
        if: ${{ success() && env.WHATSAPP_NOTIFY == 'true' }}
        continue-on-error: true
        run: |
          BLOG_URL="$(node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("linkedin-post-result.json","utf8"));console.log(r.blogUrl||"")')"
          LINKEDIN_URL="$(node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("linkedin-post-result.json","utf8"));console.log(r.linkedInUrl||"")')"
          node scripts/send-whatsapp-notification.js --type linkedin-posted --blog-url "$BLOG_URL" --linkedin-url "$LINKEDIN_URL"
